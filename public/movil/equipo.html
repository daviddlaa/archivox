<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mi Equipo - Archivox</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/img/icono-apple-touch.png">
    <link rel="icon" type="image/x-icon" href="/img/favicon.ico">
    <link rel="stylesheet" href="/css/push-suscripcion.css">
    <link rel="stylesheet" href="/movil/css/estilos.css">
    <link rel="stylesheet" href="/movil/css/equipo.css">
    <link rel="stylesheet" href="/css/drawer.css">
    <link rel="stylesheet" href="/css/notificaciones.css">

    <script src="/js/push-suscripcion.js" defer></script></head>
<body>
    <div class="header">
        <div class="header-title">
            <h1>👑 Mi Equipo</h1>
            <p id="equipoSubtitle">Gestión de agentes</p>
        </div>
        <button class="notif-bell-usuario notif-bell-movil" onclick="abrirPanelNotificacionesWidget()" title="Notificaciones">
            🔔 <span id="notifBadgeUsuario" class="notif-badge-usuario" style="display:none">0</span>
        </button>
    </div>

    <!-- ===== TABS PRINCIPALES ===== -->
    <div class="eq-tabs" id="eqTabs">
        <button class="eq-tab active" data-tab="agentes" onclick="cambiarTab('agentes')">
            <span class="eq-tab-icon">👥</span> Agentes
        </button>
        <button class="eq-tab" data-tab="campanas" onclick="cambiarTab('campanas')">
            <span class="eq-tab-icon">📢</span> Campañas
        </button>
        <button class="eq-tab" data-tab="actividad" onclick="cambiarTab('actividad')">
            <span class="eq-tab-icon">📝</span> Actividad
        </button>
    </div>

    <div class="equipo-movil-container ptr-container" id="equipoContainer">
        <!-- Pull-to-Refresh Indicator -->
        <div class="ptr-indicator" id="ptrIndicator">
            <span class="ptr-arrow" id="ptrArrow">↓</span>
            <span class="ptr-spinner" id="ptrSpinner"></span>
            <span id="ptrText">Tira para actualizar</span>
        </div>

        <!-- ============================================================
             PESTAÑA AGENTES (default)
             ============================================================ -->
        <div class="eq-pane" id="tab-agentes">
            <!-- KPI strip compacto (3 métricas) -->
            <div class="eq-kpi-strip">
                <div class="eq-kpi">
                    <span class="eq-kpi-value" id="kpiAgentes">—</span>
                    <span class="eq-kpi-label">Activos</span>
                </div>
                <div class="eq-kpi">
                    <span class="eq-kpi-value" id="kpiAsignadas">—</span>
                    <span class="eq-kpi-label">Asignadas</span>
                </div>
                <div class="eq-kpi">
                    <span class="eq-kpi-value" id="kpiGestiones">—</span>
                    <span class="eq-kpi-label">Gestiones 7d</span>
                </div>
            </div>

            <!-- Buscador + orden -->
            <div class="eq-toolbar">
                <div class="eq-search">
                    <span class="eq-search-icon">🔍</span>
                    <input type="search" class="eq-search-input" id="agenteBusqueda"
                           placeholder="Buscar agente..." autocomplete="off"
                           oninput="filtrarAgentesPorBusqueda()">
                </div>
                <div class="eq-chip-row" id="agenteSortChips">
                    <button class="eq-chip active" data-sort="nombre" onclick="setOrdenAgentes('nombre')">Nombre</button>
                    <button class="eq-chip" data-sort="asignadas" onclick="setOrdenAgentes('asignadas')">Asignadas</button>
                    <button class="eq-chip" data-sort="actividad" onclick="setOrdenAgentes('actividad')">Actividad</button>
                </div>
            </div>

            <!-- Título + botón Nuevo -->
            <div class="eq-section-head">
                <h2>Agentes</h2>
                <span class="eq-section-count" id="agentesCount">Cargando...</span>
                <button class="eq-btn-nuevo" id="btnNuevoAgente" onclick="abrirNuevoAgente()">＋ Nuevo</button>
            </div>

            <!-- Lista de agentes -->
            <div id="equipoAgentesList">
                <div class="equipo-shimmer"></div>
                <div class="equipo-shimmer" style="margin-top:12px;"></div>
            </div>
        </div>

        <!-- ============================================================
             PESTAÑA CAMPAÑAS
             ============================================================ -->
        <div class="eq-pane" id="tab-campanas" style="display:none;">
            <div class="eq-section-head">
                <h2>Campañas del equipo</h2>
                <span class="eq-section-count" id="campanasCount">Cargando...</span>
            </div>

            <div class="eq-chip-row" id="campanaFilterChips">
                <button class="eq-chip active" data-filtro="todas" onclick="setFiltroCampanas('todas')">Todas</button>
                <button class="eq-chip" data-filtro="activa" onclick="setFiltroCampanas('activa')">Activas</button>
                <button class="eq-chip" data-filtro="completada" onclick="setFiltroCampanas('completada')">Completadas</button>
            </div>

            <div id="campanasEquipoList">
                <div class="equipo-shimmer" style="height:80px;"></div>
            </div>
        </div>

        <!-- ============================================================
             PESTAÑA ACTIVIDAD
             ============================================================ -->
        <div class="eq-pane" id="tab-actividad" style="display:none;">
            <div class="eq-section-head">
                <h2>Actividad del equipo</h2>
                <span class="eq-section-count" id="gestionesCount">Cargando...</span>
            </div>

            <div class="eq-chip-row" id="actividadAgenteChips"></div>

            <div id="gestionesEquipoList">
                <div class="equipo-shimmer" style="height:80px;"></div>
            </div>

            <button class="eq-btn-mas" id="btnCargarMasGestiones" style="display:none;" onclick="cargarMasGestiones()">
                Cargar más gestiones
            </button>
        </div>

        <!-- ============================================================
             DETALLE DE AGENTE (pantalla completa)
             ============================================================ -->
        <div class="eq-pane" id="tab-detalle" style="display:none;">
            <div class="eq-detalle" id="detalleAgenteContenido"></div>
        </div>
    </div>

    <nav class="nav-bottom">
        <a href="/m" class="nav-item">
            <img src="/img/logo/logo-icon.svg" alt="Inicio" class="nav-bottom-logo">
            <span class="nav-bottom-label">Inicio</span>
        </a>
        <a href="/m/solicitudes" class="nav-item">
            <span class="nav-bottom-icon">📋</span>
            <span class="nav-bottom-label">Solicitudes</span>
        </a>
        <a href="#" class="nav-item active" onclick="Drawer.toggle(); return false;">
            <span class="nav-bottom-icon">☰</span>
            <span class="nav-bottom-label">Menú</span>
        </a>
    </nav>

    <script src="/js/deep-link-router.js"></script>
    <script src="/js/notificaciones-dashboard.js"></script>
    <script src="/js/drawer.js"></script>
    <script src="/js/modal.js"></script>
    <script src="/movil/js/equipo.js"></script>
</body>
</html>
