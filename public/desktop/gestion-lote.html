<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campañas - Archivox</title>
    <link rel="stylesheet" href="/desktop/css/base.css">
    <link rel="stylesheet" href="/css/drawer.css">
    <link rel="stylesheet" href="/css/notificaciones.css">
    <link rel="stylesheet" href="/css/modal.css">
    <link rel="stylesheet" href="/css/gestion-lote.css">
</head>
<body>
    <div id="drawer-wrapper"></div>

<div class="layout">
        <main class="contenido">
            <div class="container">
                <div class="page-header">
                    <div class="page-header-left">
                        <p class="page-kicker">🚀 Campañas</p>
                        <h1 id="gestion-nombre">Selecciona una campaña</h1>
                        <p class="subtitulo gestion-estado" id="gestion-estado"></p>
                    </div>
                    <div class="page-header-right">
                        <div class="campañas-selector" id="campañas-selector">
                            <button type="button" class="btn-header btn-header-primary" id="btn-campañas" onclick="CampanasPopover.toggle(event)" aria-haspopup="true" aria-expanded="false" aria-controls="campañas-popover">
                                📋 Campañas <span class="campañas-count" id="campañas-count"></span>
                                <span class="campañas-chevron" aria-hidden="true">▾</span>
                            </button>
                            <div class="campañas-popover" id="campañas-popover" role="menu" hidden>
                                <div class="campañas-popover-header">
                                    <span>Seleccionar campaña</span>
                                </div>
                                <div class="campañas-popover-list" id="lista-campañas">
                                    <div class="loading">Cargando campañas...</div>
                                </div>
                            </div>
                        </div>
                        <button class="notif-bell-usuario" onclick="abrirPanelNotificaciones()" title="Notificaciones">
                            🔔 <span id="notifBadgeUsuario" class="notif-badge-usuario" style="display:none">0</span>
                        </button>
                        <button class="btn-header btn-header-success" id="btn-exportar-excel" onclick="exportarExcelGestionLote()" style="display:none">📥 Exportar Excel</button>
                        <a href="/solicitudes" class="btn-header btn-header-secondary">← Volver a Solicitudes</a>
                    </div>
                </div>
                
                <!-- Semáforo operativo (filtro por color) -->
                <div class="progreso-panel" id="panel-progreso" style="display: none;">
                    <div class="semaforo-meta">
                        <span class="semaforo-meta-label">Semáforo de la campaña</span>
                        <span class="semaforo-meta-total">Total: <strong id="total-solicitudes">0</strong></span>
                        <button type="button" class="semaforo-clear" id="btn-semaforo-todos" onclick="setFiltroSemaforo(null)" style="display:none;">Ver todas</button>
                    </div>
                    <div class="semaforo-barra" id="semaforo-barra" role="group" aria-label="Filtro por semáforo">
                        <button type="button" class="semaforo-seg semaforo-seg-sin" data-semaforo="sin_clasificar" onclick="setFiltroSemaforo('sin_clasificar')" title="Sin clasificar">
                            <span class="semaforo-seg-label"><span class="semaforo-seg-dot"></span>Sin clasificar</span>
                            <span class="semaforo-seg-count" id="count-sin_clasificar">0</span>
                        </button>
                        <button type="button" class="semaforo-seg semaforo-seg-verde" data-semaforo="verde" onclick="setFiltroSemaforo('verde')" title="Verde">
                            <span class="semaforo-seg-label"><span class="semaforo-seg-dot"></span>Verde</span>
                            <span class="semaforo-seg-count" id="count-verde">0</span>
                        </button>
                        <button type="button" class="semaforo-seg semaforo-seg-amarillo" data-semaforo="amarillo" onclick="setFiltroSemaforo('amarillo')" title="Amarillo">
                            <span class="semaforo-seg-label"><span class="semaforo-seg-dot"></span>Amarillo</span>
                            <span class="semaforo-seg-count" id="count-amarillo">0</span>
                        </button>
                        <button type="button" class="semaforo-seg semaforo-seg-rojo" data-semaforo="rojo" onclick="setFiltroSemaforo('rojo')" title="Rojo">
                            <span class="semaforo-seg-label"><span class="semaforo-seg-dot"></span>Rojo</span>
                            <span class="semaforo-seg-count" id="count-rojo">0</span>
                        </button>
                    </div>
                    <div class="semaforo-legend" id="semaforo-legend">
                        <div class="semaforo-legend-item">
                            <span class="semaforo-legend-dot sin"></span>
                            <span>Sin clasificar</span>
                            <span class="semaforo-legend-count" id="legend-sin_clasificar">0</span>
                        </div>
                        <div class="semaforo-legend-item">
                            <span class="semaforo-legend-dot verde"></span>
                            <span>Verde</span>
                            <span class="semaforo-legend-count" id="legend-verde">0</span>
                        </div>
                        <div class="semaforo-legend-item">
                            <span class="semaforo-legend-dot amarillo"></span>
                            <span>Amarillo</span>
                            <span class="semaforo-legend-count" id="legend-amarillo">0</span>
                        </div>
                        <div class="semaforo-legend-item">
                            <span class="semaforo-legend-dot rojo"></span>
                            <span>Rojo</span>
                            <span class="semaforo-legend-count" id="legend-rojo">0</span>
                        </div>
                    </div>
                    <!-- Contadores legacy ocultos (actualizados por JS existente) -->
                    <span id="gestionadas" style="display:none">0</span>
                    <span id="pendientes" style="display:none">0</span>
                    <span id="progreso-porcentaje" style="display:none">0%</span>
                    <div id="barra-progreso" style="display:none;width:0%"></div>
                </div>

                <!-- Filtros y Búsqueda -->
                <div class="filtros-row" id="filtros-row" style="display: none;">
                    <input type="text" id="busqueda" placeholder="🔍 Buscar por id, cédula, nombre o teléfono...">
                    <select id="filtro-estado">
                        <option value="">Todos los estados</option>
                        <option value="Pendiente">Pendiente</option>
                        <option value="Llamada">Llamada</option>
                        <option value="WhatsApp">WhatsApp</option>
                        <option value="Seguimiento">Seguimiento</option>
                        <option value="Cobranza">Cobranza</option>
                        <option value="Cita">Cita</option>
                        <option value="Completada">Completada</option>
                    </select>
                    <div id="agregar-solicitudes-container" style="display:none;">
                        <button type="button" class="btn-agregar-solicitudes" onclick="abrirModalAgregarSolicitudes()">➕ Agregar Solicitudes</button>
                    </div>
                </div>

                <!-- Lista de Solicitudes -->
                <div class="lista-solicitudes" id="lista-solicitudes">
                    <div class="empty">
                        <p>Selecciona una campaña para ver las solicitudes.</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- SheetJS para exportar Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="/js/deep-link-router.js"></script>
    <script src="/js/notificaciones-dashboard.js"></script>
    <script src="/js/modal.js"></script>
    <script src="/js/drawer.js"></script>
    <script src="/desktop/js/gestion-lote.js"></script>

</body>
</html>
